<!-- Animace motodlahy Artromot K1 - mechanismus + noha s kolenem -->
<style>
    .cpm-widget {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #fff;
        border-radius: 16px;
        padding: 20px 15px 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        max-width: 640px;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        margin: 0 auto;
    }
    .cpm-widget h2 { margin: 0 0 2px; color: #333; font-size: 20px; }
    .cpm-widget .sub { color: #aaa; font-size: 12px; margin: 0 0 8px; }
    .cpm-widget svg { width: 100%; height: auto; display: block; background: #5b9bd5; border-radius: 10px; }
    .cpm-widget .ctrl {
        display: flex; align-items: center; justify-content: center;
        gap: 14px; margin-top: 10px; flex-wrap: wrap;
    }
    .cpm-widget .btn {
        background: #e74c3c; color: #fff; border: none; border-radius: 8px;
        padding: 7px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .cpm-widget .btn:hover { background: #c0392b; }
    .cpm-widget .info { font-size: 15px; font-weight: 600; color: #333; }
    .cpm-widget .info span { color: #e74c3c; }
    .cpm-widget .spd {
        display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888;
    }
    .cpm-widget .spd input[type=range] {
        width: 70px; height: 4px; border-radius: 2px; background: #e1e5e9;
        -webkit-appearance: none; appearance: none; cursor: pointer;
    }
    .cpm-widget .spd input::-webkit-slider-thumb {
        -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
        background: #e74c3c; cursor: pointer;
    }
    .cpm-widget .spd input::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%;
        background: #e74c3c; border: none; cursor: pointer;
    }
</style>

<div class="cpm-widget">
    <h2>Motodlaha - Artromot K1</h2>
    <p class="sub">Kontinuální pasivní pohyb kolena</p>

    <svg id="cpmSvg" viewBox="0 0 700 400" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Metal gradient (silver) -->
            <linearGradient id="gMet" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#d8dce0"/>
                <stop offset="40%" stop-color="#c0c4c8"/>
                <stop offset="100%" stop-color="#8a9098"/>
            </linearGradient>
            <linearGradient id="gMetLight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#e8ecf0"/>
                <stop offset="100%" stop-color="#b0b8c0"/>
            </linearGradient>
            <linearGradient id="gMetDark" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#a0a8b0"/>
                <stop offset="100%" stop-color="#707880"/>
            </linearGradient>
            <!-- Blue base -->
            <linearGradient id="gBase" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#4a90c4"/>
                <stop offset="100%" stop-color="#2a6090"/>
            </linearGradient>
            <!-- Skin -->
            <linearGradient id="gSkin" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#f8d4b0"/>
                <stop offset="100%" stop-color="#e6ad7a"/>
            </linearGradient>
            <linearGradient id="gSkinLight" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fce0c4"/>
                <stop offset="100%" stop-color="#f0c49a"/>
            </linearGradient>
            <radialGradient id="gKnee" cx="50%" cy="40%">
                <stop offset="0%" stop-color="#fce0c4"/>
                <stop offset="70%" stop-color="#e6ad7a"/>
                <stop offset="100%" stop-color="#d49060"/>
            </radialGradient>
            <filter id="sh">
                <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
            </filter>
        </defs>

        <!-- ===== BLUE BASE PLATFORM ===== -->
        <rect x="80" y="340" width="480" height="22" rx="4" fill="url(#gBase)" filter="url(#sh)"/>
        <rect x="80" y="340" width="480" height="6" rx="3" fill="#5a9fd4"/>
        <text x="320" y="356" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9" font-weight="bold" font-family="Arial">ARTROMOT · K1</text>

        <!-- ===== BASE FRAME (horizontal rail on the platform) ===== -->
        <!-- Main horizontal rail -->
        <rect x="100" y="320" width="440" height="10" rx="3" fill="url(#gMet)" stroke="#888" stroke-width="0.5"/>
        <!-- Support feet -->
        <rect x="115" y="330" width="12" height="12" rx="2" fill="url(#gMetDark)"/>
        <rect x="250" y="330" width="12" height="12" rx="2" fill="url(#gMetDark)"/>
        <rect x="380" y="330" width="12" height="12" rx="2" fill="url(#gMetDark)"/>
        <rect x="510" y="330" width="12" height="12" rx="2" fill="url(#gMetDark)"/>

        <!-- ===== FIXED THIGH FRAME ===== -->
        <!-- Left vertical post (hip end) -->
        <rect x="108" y="260" width="10" height="65" rx="3" fill="url(#gMet)" stroke="#888" stroke-width="0.5"/>
        <!-- Top bracket on left post -->
        <rect x="102" y="255" width="22" height="14" rx="4" fill="url(#gMetLight)" stroke="#999" stroke-width="0.5"/>
        <!-- Adjustment screw on top -->
        <rect x="109" y="242" width="8" height="18" rx="2" fill="url(#gMetDark)"/>
        <circle cx="113" cy="242" r="5" fill="#999" stroke="#777" stroke-width="0.5"/>

        <!-- Thigh horizontal bar (upper) -->
        <rect x="118" y="278" width="190" height="8" rx="3" fill="url(#gMet)" stroke="#888" stroke-width="0.5"/>
        <!-- Thigh horizontal bar (lower) -->
        <rect x="118" y="310" width="190" height="8" rx="3" fill="url(#gMet)" stroke="#888" stroke-width="0.5"/>

        <!-- Thigh support pad -->
        <rect x="130" y="282" width="160" height="30" rx="6" fill="#e8ecf0" stroke="#ccc" stroke-width="0.5" opacity="0.8"/>

        <!-- Thigh clamp knobs -->
        <circle cx="145" cy="275" r="5" fill="#444" stroke="#333" stroke-width="0.8"/>
        <circle cx="275" cy="275" r="5" fill="#444" stroke="#333" stroke-width="0.8"/>

        <!-- ===== KNEE PIVOT JOINT ===== -->
        <!-- Large pivot circle -->
        <circle id="pivotOuter" cx="310" cy="300" r="14" fill="url(#gMetDark)" stroke="#666" stroke-width="1.5"/>
        <circle id="pivotInner" cx="310" cy="300" r="7" fill="#888" stroke="#666" stroke-width="1"/>
        <circle cx="310" cy="300" r="3" fill="#555"/>

        <!-- ===== MOVING SHIN FRAME (pivots at 310,300) ===== -->
        <g id="shinFrame">
            <!-- Shin upper bar -->
            <rect x="310" y="278" width="200" height="8" rx="3" fill="url(#gMet)" stroke="#888" stroke-width="0.5"/>
            <!-- Shin lower bar -->
            <rect x="310" y="310" width="200" height="8" rx="3" fill="url(#gMet)" stroke="#888" stroke-width="0.5"/>

            <!-- Shin support pad -->
            <rect x="330" y="282" width="150" height="30" rx="6" fill="#e8ecf0" stroke="#ccc" stroke-width="0.5" opacity="0.8"/>

            <!-- Connecting diagonal brace -->
            <line x1="320" y1="286" x2="350" y2="318" stroke="#a0a8b0" stroke-width="4" stroke-linecap="round"/>

            <!-- Shin clamp knobs -->
            <circle cx="360" cy="275" r="5" fill="#444" stroke="#333" stroke-width="0.8"/>
            <circle cx="470" cy="275" r="5" fill="#444" stroke="#333" stroke-width="0.8"/>

            <!-- Right vertical post (foot end) -->
            <rect x="498" y="250" width="10" height="68" rx="3" fill="url(#gMet)" stroke="#888" stroke-width="0.5"/>

            <!-- Foot plate bracket -->
            <rect x="492" y="245" width="22" height="14" rx="4" fill="url(#gMetLight)" stroke="#999" stroke-width="0.5"/>

            <!-- Foot plate -->
            <rect x="488" y="228" width="30" height="22" rx="5" fill="url(#gMetLight)" stroke="#999" stroke-width="0.8"/>
            <rect x="488" y="228" width="30" height="5" rx="3" fill="#c0c8d0"/>

            <!-- Ankle strap mount -->
            <circle cx="503" cy="318" r="4.5" fill="#555" stroke="#444" stroke-width="0.5"/>
        </g>

        <!-- ===== LINKAGE ARMS (connecting mechanism) ===== -->
        <!-- Upper linkage arm -->
        <line id="linkUp1" x1="280" y1="278" x2="310" y2="278" stroke="#a0a8b0" stroke-width="6" stroke-linecap="round"/>
        <line id="linkUp2" x1="310" y1="278" x2="340" y2="278" stroke="#a0a8b0" stroke-width="6" stroke-linecap="round"/>
        <!-- Lower linkage arm -->
        <line id="linkLo1" x1="280" y1="318" x2="310" y2="318" stroke="#a0a8b0" stroke-width="6" stroke-linecap="round"/>
        <line id="linkLo2" x1="310" y1="318" x2="340" y2="318" stroke="#a0a8b0" stroke-width="6" stroke-linecap="round"/>
        <!-- Linkage pivot points -->
        <circle id="lkPivA" cx="280" cy="278" r="4" fill="#666"/>
        <circle id="lkPivB" cx="340" cy="278" r="4" fill="#666"/>
        <circle id="lkPivC" cx="280" cy="318" r="4" fill="#666"/>
        <circle id="lkPivD" cx="340" cy="318" r="4" fill="#666"/>

        <!-- ===== HUMAN LEG ===== -->
        <!-- Thigh (fixed, horizontal) -->
        <path id="thighSkin" d="M140,272 C155,254 185,248 220,246 L285,248 C300,252 308,264 310,278
                 C308,292 300,298 285,300 L175,300 C155,298 142,290 140,272Z"
              fill="url(#gSkin)" filter="url(#sh)" opacity="0.92"/>
        <!-- Thigh muscle line -->
        <path d="M170,256 C210,250 260,250 290,256" stroke="#dda06a" stroke-width="0.7" fill="none" opacity="0.4"/>

        <!-- Shin + Foot (animated) -->
        <g id="shinLeg">
            <!-- Calf -->
            <path d="M318,258 C340,248 390,244 440,248 L480,256
                     C492,264 496,276 494,288
                     L490,296 C484,302 460,306 435,306
                     L340,306 C324,304 316,296 314,284 Z"
                  fill="url(#gSkin)" filter="url(#sh)" opacity="0.92"/>
            <!-- Calf muscle definition -->
            <path d="M345,260 C385,252 430,252 460,258" stroke="#dda06a" stroke-width="0.7" fill="none" opacity="0.35"/>
            <!-- Shin bone hint -->
            <path d="M330,262 C340,280 340,290 335,300" stroke="#dda06a" stroke-width="0.5" fill="none" opacity="0.25"/>

            <!-- Foot -->
            <path d="M482,260 C492,254 504,250 514,254
                     L518,264 C520,274 518,286 512,294
                     L496,298 C486,298 480,292 480,282 Z"
                  fill="url(#gSkinLight)" opacity="0.92"/>
            <!-- Toe lines -->
            <path d="M512,258 C516,264 518,272 516,284" stroke="#cca060" stroke-width="0.4" fill="none" opacity="0.3"/>
            <!-- Ankle definition -->
            <ellipse cx="484" cy="276" rx="6" ry="10" fill="none" stroke="#d4a06a" stroke-width="0.5" opacity="0.3"/>
        </g>

        <!-- ===== KNEE (always on top) ===== -->
        <g id="kneeGroup">
            <!-- Knee skin area -->
            <ellipse id="kneeOuter" cx="312" cy="270" rx="24" ry="22" fill="url(#gKnee)" filter="url(#sh)" opacity="0.92"/>
            <!-- Patella (kneecap) -->
            <ellipse id="kneecap" cx="312" cy="268" rx="14" ry="12" fill="#f4d4a8" stroke="#d4a46a" stroke-width="0.7"/>
            <!-- Kneecap highlight -->
            <ellipse cx="310" cy="264" rx="7" ry="4.5" fill="rgba(255,255,255,0.3)"/>
            <!-- Knee creases (visible when bent) -->
            <path id="kneeCrease1" d="M298,278 C305,282 319,282 326,278" stroke="#c89060" stroke-width="0.6" fill="none" opacity="0"/>
            <path id="kneeCrease2" d="M300,284 C307,287 317,287 324,284" stroke="#c89060" stroke-width="0.5" fill="none" opacity="0"/>
        </g>

        <!-- ===== MOTOR HOUSING ===== -->
        <rect x="290" y="326" width="40" height="14" rx="3" fill="#d0d4d8" stroke="#aaa" stroke-width="0.5"/>
        <circle cx="300" cy="333" r="2.5" fill="#e74c3c"/>
        <circle cx="320" cy="333" r="2.5" fill="#4CAF50"/>
    </svg>

    <div class="ctrl">
        <button class="btn" id="cpmBtn" onclick="cpmToggle()">Zastavit</button>
        <div class="info">Ohyb: <span id="cpmDeg">0°</span></div>
        <div class="spd">
            Rychlost:
            <input type="range" id="cpmSpd" min="1" max="5" value="3" oninput="cpmSetSpd()">
        </div>
    </div>
</div>

<script>
(function(){
    // Pivot point = knee joint
    const PX = 310, PY = 300;
    const MAX = 110;
    let on = true, ang = 0, dir = 1, raf = null, spd = 1;

    const rad = d => d * Math.PI / 180;

    // Rotate a point around pivot
    function rp(x, y, a) {
        const r = rad(-a), dx = x - PX, dy = y - PY;
        return [
            PX + dx * Math.cos(r) - dy * Math.sin(r),
            PY + dx * Math.sin(r) + dy * Math.cos(r)
        ];
    }

    function draw(a) {
        const t = `rotate(${-a} ${PX} ${PY})`;

        // Rotate mechanical shin frame
        document.getElementById('shinFrame').setAttribute('transform', t);

        // Rotate leg shin
        document.getElementById('shinLeg').setAttribute('transform', t);

        // Linkage animation - the connecting arms between fixed and moving parts
        const upR = rp(340, 278, a);
        const loR = rp(340, 318, a);
        document.getElementById('linkUp2').setAttribute('x2', upR[0]);
        document.getElementById('linkUp2').setAttribute('y2', upR[1]);
        document.getElementById('linkLo2').setAttribute('x2', loR[0]);
        document.getElementById('linkLo2').setAttribute('y2', loR[1]);
        document.getElementById('lkPivB').setAttribute('cx', upR[0]);
        document.getElementById('lkPivB').setAttribute('cy', upR[1]);
        document.getElementById('lkPivD').setAttribute('cx', loR[0]);
        document.getElementById('lkPivD').setAttribute('cy', loR[1]);

        // Knee adapts to bending
        const kneeY = 270 - a * 0.05;
        const kneeRX = 24 + a * 0.06;
        const kneeRY = 22 + a * 0.08;
        document.getElementById('kneeOuter').setAttribute('cy', kneeY);
        document.getElementById('kneeOuter').setAttribute('rx', kneeRX);
        document.getElementById('kneeOuter').setAttribute('ry', kneeRY);
        document.getElementById('kneecap').setAttribute('cy', kneeY - 2);

        // Knee creases become visible when bent
        const creaseOpacity = Math.max(0, (a - 30) / 80) * 0.6;
        document.getElementById('kneeCrease1').setAttribute('opacity', creaseOpacity);
        document.getElementById('kneeCrease2').setAttribute('opacity', creaseOpacity * 0.7);

        // Update angle display
        document.getElementById('cpmDeg').textContent = Math.round(a) + '°';
    }

    function tick() {
        if (!on) return;
        // Ease at ends for realistic motion
        const d = Math.min(ang, MAX - ang);
        const ease = d < 12 ? 0.3 + 0.7 * (d / 12) : 1;
        ang += dir * 0.45 * spd * ease;
        if (ang >= MAX) { ang = MAX; dir = -1; }
        else if (ang <= 0) { ang = 0; dir = 1; }
        draw(ang);
        raf = requestAnimationFrame(tick);
    }

    window.cpmToggle = function() {
        on = !on;
        document.getElementById('cpmBtn').textContent = on ? 'Zastavit' : 'Spustit';
        if (on) tick(); else if (raf) cancelAnimationFrame(raf);
    };
    window.cpmSetSpd = function() {
        spd = document.getElementById('cpmSpd').value / 3;
    };

    draw(0);
    tick();
})();
</script>
