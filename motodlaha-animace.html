<!-- Animace motodlahy (CPM) - koleno se ohýbá nahoru a dolů -->
<style>
    .cpm-animation-container {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: white;
        border-radius: 16px;
        padding: 25px 20px 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
    }

    .cpm-animation-container h2 {
        margin: 0 0 3px 0;
        color: #333;
        font-size: 20px;
    }

    .cpm-animation-container .subtitle {
        color: #999;
        font-size: 13px;
        margin: 0 0 10px 0;
    }

    .cpm-animation-container svg {
        width: 100%;
        height: auto;
        display: block;
    }

    .cpm-animation-container .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        margin-top: 12px;
        flex-wrap: wrap;
    }

    .cpm-animation-container .btn {
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }

    .cpm-animation-container .btn:hover {
        background: #c0392b;
    }

    .cpm-animation-container .angle-display {
        font-size: 16px;
        font-weight: 600;
        color: #333;
        min-width: 90px;
    }

    .cpm-animation-container .angle-display span {
        color: #e74c3c;
    }

    .cpm-animation-container .speed-control {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #666;
    }

    .cpm-animation-container .speed-control input[type="range"] {
        width: 80px;
        height: 4px;
        border-radius: 2px;
        background: #e1e5e9;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
    }

    .cpm-animation-container .speed-control input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #e74c3c;
        cursor: pointer;
    }

    .cpm-animation-container .speed-control input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #e74c3c;
        border: none;
        cursor: pointer;
    }

    @media (max-width: 480px) {
        .cpm-animation-container {
            padding: 15px 10px 12px;
            border-radius: 12px;
        }
        .cpm-animation-container h2 { font-size: 17px; }
    }
</style>

<div class="cpm-animation-container">
    <h2>Motodlaha - Artromot K1</h2>
    <p class="subtitle">Kontinuální pasivní pohyb kolena</p>

    <svg id="cpmSvg" viewBox="20 30 560 250" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#5ba3d9" />
                <stop offset="100%" style="stop-color:#3a7fc1" />
            </linearGradient>
            <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#d8d8d8" />
                <stop offset="100%" style="stop-color:#b0b0b0" />
            </linearGradient>
            <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#f5d0b0" />
                <stop offset="100%" style="stop-color:#e8b88a" />
            </linearGradient>
            <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#f5f7fa" />
                <stop offset="100%" style="stop-color:#e0e6ed" />
            </linearGradient>
            <filter id="shadow">
                <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
            </filter>
        </defs>

        <!-- Base platform (blue oval) -->
        <ellipse cx="300" cy="255" rx="240" ry="16" fill="url(#baseGrad)" filter="url(#shadow)"/>
        <text x="300" y="259" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Arial">ARTROMOT · K1</text>

        <!-- Fixed thigh section -->
        <!-- Thigh rail -->
        <rect x="75" y="212" width="210" height="14" rx="4" fill="url(#metalGrad)" stroke="#999" stroke-width="0.5"/>
        <!-- Thigh support pad -->
        <rect x="85" y="192" width="180" height="24" rx="8" fill="url(#padGrad)" stroke="#ccc" stroke-width="0.5"/>
        <!-- Thigh straps -->
        <rect x="115" y="186" width="14" height="36" rx="4" fill="#444"/>
        <rect x="195" y="186" width="14" height="36" rx="4" fill="#444"/>
        <!-- Thigh knobs -->
        <circle cx="90" cy="232" r="5" fill="#444"/>
        <circle cx="270" cy="232" r="5" fill="#444"/>

        <!-- Knee joint pivot -->
        <circle cx="280" cy="219" r="8" fill="#666" stroke="#444" stroke-width="1.5"/>

        <!-- Shin assembly group - animated -->
        <g id="shinGroup" transform-origin="280 219">
            <!-- Shin rail -->
            <rect x="280" y="212" width="210" height="14" rx="4" fill="url(#metalGrad)" stroke="#999" stroke-width="0.5"/>
            <!-- Shin support pad -->
            <rect x="305" y="192" width="150" height="24" rx="8" fill="url(#padGrad)" stroke="#ccc" stroke-width="0.5"/>
            <!-- Foot plate -->
            <rect x="468" y="182" width="32" height="50" rx="6" fill="url(#padGrad)" stroke="#bbb" stroke-width="1"/>
            <!-- Foot plate top edge -->
            <rect x="468" y="182" width="32" height="6" rx="3" fill="#ccc"/>
            <!-- Shin straps -->
            <rect x="340" y="186" width="14" height="36" rx="4" fill="#444"/>
            <rect x="420" y="186" width="14" height="36" rx="4" fill="#444"/>
            <!-- Shin knob -->
            <circle cx="480" cy="232" r="5" fill="#444"/>
        </g>

        <!-- Thigh skin (fixed) -->
        <path d="M115,196 C130,180 160,176 200,176 L250,178 C268,182 275,190 278,200 L278,212 C270,216 250,218 230,218 L140,218 C125,216 118,210 115,196 Z"
              fill="url(#skinGrad)" opacity="0.85"/>

        <!-- Shin skin - animated via JS -->
        <path id="shinSkin" d="" fill="url(#skinGrad)" opacity="0.85"/>

        <!-- Knee cap -->
        <ellipse id="kneeCap" cx="278" cy="198" rx="15" ry="14" fill="#f0c8a0" stroke="#ddb08a" stroke-width="0.8"/>

        <!-- Motor box -->
        <rect x="255" y="234" width="50" height="18" rx="4" fill="#e0e0e0" stroke="#bbb" stroke-width="0.5"/>
        <circle cx="268" cy="243" r="3.5" fill="#e74c3c"/>
        <circle cx="292" cy="243" r="3.5" fill="#4CAF50"/>

        <!-- Cable to controller -->
        <path d="M255,243 C220,260 180,258 140,262 S100,268 80,270" stroke="#999" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- Remote controller -->
        <g transform="translate(42,256)">
            <rect x="0" y="0" width="48" height="32" rx="10" fill="#f0f0f0" stroke="#ccc" stroke-width="1" filter="url(#shadow)"/>
            <rect x="10" y="4" width="28" height="11" rx="3" fill="#d0e4f0" stroke="#a8c0d4" stroke-width="0.5"/>
            <circle cx="16" cy="23" r="4.5" fill="#e74c3c" stroke="#c0392b" stroke-width="0.5"/>
            <circle cx="32" cy="23" r="4.5" fill="#4CAF50" stroke="#388E3C" stroke-width="0.5"/>
        </g>
    </svg>

    <div class="controls">
        <button class="btn" id="cpmToggleBtn" onclick="toggleCpmAnimation()">Spustit</button>
        <div class="angle-display">Ohyb: <span id="cpmAngleValue">0°</span></div>
        <div class="speed-control">
            <label>Rychlost:</label>
            <input type="range" id="cpmSpeed" min="1" max="5" value="3" oninput="updateCpmSpeed()">
        </div>
    </div>
</div>

<script>
(function() {
    let running = false;
    let angle = 0;
    let direction = 1;
    let animFrame = null;
    let speedFactor = 1;
    const MAX_ANGLE = 110;
    const PIVOT_X = 280;
    const PIVOT_Y = 219;

    function toRad(deg) { return deg * Math.PI / 180; }

    function rotPt(x, y, a) {
        const r = toRad(-a);
        const dx = x - PIVOT_X, dy = y - PIVOT_Y;
        return {
            x: PIVOT_X + dx * Math.cos(r) - dy * Math.sin(r),
            y: PIVOT_Y + dx * Math.sin(r) + dy * Math.cos(r)
        };
    }

    function update(a) {
        // Rotate the entire shin group
        document.getElementById('shinGroup').setAttribute('transform', `rotate(${-a} ${PIVOT_X} ${PIVOT_Y})`);

        // Shin skin points
        const pts = [
            rotPt(288, 178, a), // top-left
            rotPt(340, 176, a), // top-mid
            rotPt(430, 176, a), // top-right-mid
            rotPt(465, 184, a), // top-right (near foot)
            rotPt(465, 214, a), // bottom-right
            rotPt(430, 218, a), // bottom-right-mid
            rotPt(340, 218, a), // bottom-mid
            rotPt(288, 214, a), // bottom-left
        ];

        document.getElementById('shinSkin').setAttribute('d',
            `M${pts[0].x},${pts[0].y} C${pts[1].x},${pts[1].y} ${pts[2].x},${pts[2].y} ${pts[3].x},${pts[3].y}` +
            ` L${pts[4].x},${pts[4].y}` +
            ` C${pts[5].x},${pts[5].y} ${pts[6].x},${pts[6].y} ${pts[7].x},${pts[7].y} Z`
        );

        // Move kneecap slightly
        const kcY = 198 - a * 0.02;
        document.getElementById('kneeCap').setAttribute('cy', kcY);

        document.getElementById('cpmAngleValue').textContent = Math.round(a) + '°';
    }

    function animate() {
        if (!running) return;

        // Sinusoidal easing for smooth reversal
        angle += direction * 0.5 * speedFactor;

        if (angle >= MAX_ANGLE) { angle = MAX_ANGLE; direction = -1; }
        else if (angle <= 0) { angle = 0; direction = 1; }

        update(angle);
        animFrame = requestAnimationFrame(animate);
    }

    window.toggleCpmAnimation = function() {
        running = !running;
        document.getElementById('cpmToggleBtn').textContent = running ? 'Zastavit' : 'Spustit';
        if (running) animate();
        else if (animFrame) cancelAnimationFrame(animFrame);
    };

    window.updateCpmSpeed = function() {
        speedFactor = parseFloat(document.getElementById('cpmSpeed').value) / 3;
    };

    // Start at 0°
    update(0);

    // Auto-start the animation
    running = true;
    document.getElementById('cpmToggleBtn').textContent = 'Zastavit';
    animate();
})();
</script>
