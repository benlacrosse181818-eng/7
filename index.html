<!-- Kalkulačka pronájmu - vlož tento kód kamkoliv na stránku -->
<style>
    .rental-calculator {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: white;
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        max-width: 100%;
        width: 100%;
        box-sizing: border-box;
    }

    @media (min-width: 500px) {
        .rental-calculator {
            max-width: 400px;
        }
    }

    @media (max-width: 480px) {
        .rental-calculator {
            padding: 20px;
            border-radius: 12px;
        }
    }

    .rental-calculator * {
        box-sizing: border-box;
    }

    .rental-calculator h2 {
        margin: 0 0 10px 0;
        color: #333;
        font-size: 22px;
        text-align: center;
    }

    .rental-calculator .pricing-info {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        font-size: 14px;
        color: #666;
    }

    .rental-calculator .pricing-info p {
        margin: 5px 0;
    }

    .rental-calculator .input-group {
        margin-bottom: 20px;
    }

    .rental-calculator label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
    }

    .rental-calculator .days-value {
        font-size: 22px;
        font-weight: 700;
        color: #e74c3c;
    }

    .rental-calculator input[type="range"] {
        width: 100%;
        height: 8px;
        border-radius: 4px;
        background: #e1e5e9;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
    }

    .rental-calculator input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #e74c3c;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(231, 76, 60, 0.4);
    }

    .rental-calculator input[type="range"]::-moz-range-thumb {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #e74c3c;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 6px rgba(231, 76, 60, 0.4);
    }

    .rental-calculator .range-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 12px;
        color: #999;
    }

    .rental-calculator .result {
        margin-top: 20px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 8px;
    }

    .rental-calculator .result-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        color: #666;
        font-size: 14px;
    }

    .rental-calculator .result-row:last-child {
        margin-bottom: 0;
        padding-top: 10px;
        border-top: 2px solid #e1e5e9;
        color: #333;
        font-size: 18px;
        font-weight: 600;
    }

    .rental-calculator .total-price {
        color: #e74c3c;
    }

    .rental-calculator .note {
        margin-top: 15px;
        padding-top: 12px;
        border-top: 1px solid #e1e5e9;
        font-size: 12px;
        color: #999;
        text-align: center;
    }

    @media (max-width: 480px) {
        .rental-calculator h2 {
            font-size: 20px;
        }

        .rental-calculator .days-value {
            font-size: 20px;
        }

        .rental-calculator .result-row:last-child {
            font-size: 16px;
        }

        .rental-calculator .pricing-info {
            padding: 12px;
            font-size: 13px;
        }
    }
</style>

<div class="rental-calculator">
    <h2>Kalkulačka pronájmu</h2>

    <div class="pricing-info">
        <p><strong>Ceník:</strong></p>
        <p>1-30 dnů: <strong>400 Kč</strong> / den</p>
        <p>Od 31. dne: <strong>350 Kč</strong> / den</p>
    </div>

    <div class="input-group">
        <label>Počet dnů pronájmu: <span id="rentalDaysValue" class="days-value">1 den</span></label>
        <input type="range" id="rentalDays" min="1" max="90" value="1" oninput="calculateRental()">
        <div class="range-labels">
            <span>1 den</span>
            <span>90 dnů</span>
        </div>
    </div>

    <div class="result">
        <div class="result-row">
            <span>Dny za 400 Kč:</span>
            <span id="rentalDays400">1 den = 400 Kč</span>
        </div>
        <div class="result-row">
            <span>Dny za 350 Kč:</span>
            <span id="rentalDays350">0 dnů = 0 Kč</span>
        </div>
        <div class="result-row">
            <span>Celková cena:</span>
            <span class="total-price" id="rentalTotalPrice">400 Kč</span>
        </div>
    </div>

    <div class="note">
        Cena nezahrnuje dopravné
    </div>
</div>

<script>
    function calculateRental() {
        const days = parseInt(document.getElementById('rentalDays').value);

        let daysWord;
        if (days === 1) daysWord = 'den';
        else if (days >= 2 && days <= 4) daysWord = 'dny';
        else daysWord = 'dnů';

        document.getElementById('rentalDaysValue').textContent = days + ' ' + daysWord;

        const days400 = Math.min(days, 30);
        const days350 = Math.max(0, days - 30);

        const price400 = days400 * 400;
        const price350 = days350 * 350;
        const total = price400 + price350;

        let word400;
        if (days400 === 1) word400 = 'den';
        else if (days400 >= 2 && days400 <= 4) word400 = 'dny';
        else word400 = 'dnů';

        let word350;
        if (days350 === 1) word350 = 'den';
        else if (days350 >= 2 && days350 <= 4) word350 = 'dny';
        else word350 = 'dnů';

        document.getElementById('rentalDays400').textContent =
            days400 + ' ' + word400 + ' = ' + price400.toLocaleString('cs-CZ') + ' Kč';
        document.getElementById('rentalDays350').textContent =
            days350 + ' ' + word350 + ' = ' + price350.toLocaleString('cs-CZ') + ' Kč';
        document.getElementById('rentalTotalPrice').textContent =
            total.toLocaleString('cs-CZ') + ' Kč';
    }

    calculateRental();
</script>
