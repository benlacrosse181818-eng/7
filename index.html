<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulačka pronájmu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 24px;
            text-align: center;
        }

        .pricing-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #666;
        }

        .pricing-info p {
            margin: 5px 0;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 18px;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 2px solid #e1e5e9;
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }

        .total-price {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Kalkulačka pronájmu</h1>

        <div class="pricing-info">
            <p><strong>Ceník:</strong></p>
            <p>1-30 dnů: <strong>400 Kč</strong> / den</p>
            <p>Od 31. dne: <strong>350 Kč</strong> / den</p>
        </div>

        <div class="input-group">
            <label for="days">Počet dnů pronájmu:</label>
            <input type="number" id="days" min="1" placeholder="Zadejte počet dnů">
        </div>

        <button onclick="calculate()">Spočítat cenu</button>

        <div class="result" id="result">
            <div class="result-row">
                <span>Dny za 400 Kč:</span>
                <span id="days400">0 dnů = 0 Kč</span>
            </div>
            <div class="result-row">
                <span>Dny za 350 Kč:</span>
                <span id="days350">0 dnů = 0 Kč</span>
            </div>
            <div class="result-row">
                <span>Celková cena:</span>
                <span class="total-price" id="totalPrice">0 Kč</span>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const daysInput = document.getElementById('days');
            const days = parseInt(daysInput.value);

            if (isNaN(days) || days < 1) {
                alert('Zadejte prosím platný počet dnů (minimálně 1).');
                return;
            }

            const priceFirst30 = 400;
            const priceAfter30 = 350;

            let days400 = Math.min(days, 30);
            let days350 = Math.max(0, days - 30);

            let price400 = days400 * priceFirst30;
            let price350 = days350 * priceAfter30;
            let total = price400 + price350;

            document.getElementById('days400').textContent =
                days400 + ' ' + getDaysWord(days400) + ' = ' + formatPrice(price400);
            document.getElementById('days350').textContent =
                days350 + ' ' + getDaysWord(days350) + ' = ' + formatPrice(price350);
            document.getElementById('totalPrice').textContent = formatPrice(total);

            document.getElementById('result').classList.add('show');
        }

        function getDaysWord(count) {
            if (count === 1) return 'den';
            if (count >= 2 && count <= 4) return 'dny';
            return 'dnů';
        }

        function formatPrice(price) {
            return price.toLocaleString('cs-CZ') + ' Kč';
        }

        document.getElementById('days').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculate();
            }
        });
    </script>
</body>
</html>
