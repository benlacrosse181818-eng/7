<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulačka pronájmu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .calculator {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 24px;
            text-align: center;
        }

        .pricing-info {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #666;
        }

        .pricing-info p {
            margin: 5px 0;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .days-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #e1e5e9;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }

        .range-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: #999;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }

        .result-row:last-child {
            margin-bottom: 0;
            padding-top: 10px;
            border-top: 2px solid #e1e5e9;
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }

        .total-price {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h1>Kalkulačka pronájmu</h1>

        <div class="pricing-info">
            <p><strong>Ceník:</strong></p>
            <p>1-30 dnů: <strong>400 Kč</strong> / den</p>
            <p>Od 31. dne: <strong>350 Kč</strong> / den</p>
        </div>

        <div class="input-group">
            <label for="days">Počet dnů pronájmu: <span id="daysValue" class="days-value">1</span></label>
            <input type="range" id="days" min="1" max="90" value="1" oninput="calculate()">
            <div class="range-labels">
                <span>1 den</span>
                <span>90 dnů</span>
            </div>
        </div>

        <div class="result" id="result">
            <div class="result-row">
                <span>Dny za 400 Kč:</span>
                <span id="days400">0 dnů = 0 Kč</span>
            </div>
            <div class="result-row">
                <span>Dny za 350 Kč:</span>
                <span id="days350">0 dnů = 0 Kč</span>
            </div>
            <div class="result-row">
                <span>Celková cena:</span>
                <span class="total-price" id="totalPrice">0 Kč</span>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const daysInput = document.getElementById('days');
            const days = parseInt(daysInput.value);

            document.getElementById('daysValue').textContent = days + ' ' + getDaysWord(days);

            const priceFirst30 = 400;
            const priceAfter30 = 350;

            let days400 = Math.min(days, 30);
            let days350 = Math.max(0, days - 30);

            let price400 = days400 * priceFirst30;
            let price350 = days350 * priceAfter30;
            let total = price400 + price350;

            document.getElementById('days400').textContent =
                days400 + ' ' + getDaysWord(days400) + ' = ' + formatPrice(price400);
            document.getElementById('days350').textContent =
                days350 + ' ' + getDaysWord(days350) + ' = ' + formatPrice(price350);
            document.getElementById('totalPrice').textContent = formatPrice(total);

            document.getElementById('result').classList.add('show');
        }

        function getDaysWord(count) {
            if (count === 1) return 'den';
            if (count >= 2 && count <= 4) return 'dny';
            return 'dnů';
        }

        function formatPrice(price) {
            return price.toLocaleString('cs-CZ') + ' Kč';
        }

        // Spustit výpočet při načtení stránky
        calculate();
    </script>
</body>
</html>
